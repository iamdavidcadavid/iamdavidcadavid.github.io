<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Work in Progress</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f4f4f5;
        color: #27272a;
        display: flex;
        flex-direction: column;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        text-align: center;
      }

      main {
        max-width: 36rem;
        padding: 2rem;
      }

      .cooking {
        display: inline-block;
        font-size: 3rem;
        margin-bottom: 1.5rem;
        position: relative;
      }

      .steam {
        animation: drift 2.4s ease-in-out infinite;
        display: block;
        font-size: 1.5rem;
        left: 50%;
        letter-spacing: 0.4rem;
        position: absolute;
        top: -1.5rem;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .steam::after {
        content: "...";
      }

      h1 {
        font-size: clamp(2.25rem, 8vw, 4rem);
        line-height: 1;
        margin: 0 0 1rem;
      }

      h2 {
        font-size: clamp(1.35rem, 4vw, 1.75rem);
        margin: 0 0 1rem;
      }

      p {
        color: #52525b;
        font-size: 1.125rem;
        line-height: 1.6;
        margin: 0;
      }

      footer {
        bottom: 1.5rem;
        color: #71717a;
        font-size: 0.95rem;
        left: 0;
        position: absolute;
        right: 0;
      }

      @keyframes drift {
        0%, 100% {
          opacity: 0.35;
          transform: translate(-50%, 0);
        }

        50% {
          opacity: 1;
          transform: translate(-50%, -0.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .steam {
          animation: none;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #18181b;
          color: #fafafa;
        }

        p, footer {
          color: #a1a1aa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="cooking" aria-hidden="true">
        <span class="steam">~</span>
        🍲
      </div>
      <h1>Work in Progress</h1>
      <h2>Something is cooking...</h2>
      <p>This site is currently being updated. Please check back soon.</p>
    </main>
    <footer>David Cadavid will return...</footer>
  </body>
</html>
