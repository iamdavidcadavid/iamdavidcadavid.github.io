<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Maintenance · Mantenimiento — David Cadavid</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <style>
      /* Standalone on purpose: this page must work when the rest of the site may not, so it
         loads no other file. Keep in sync with src/styles/global.css (plan.md Complexity
         Tracking); only the tokens used here are copied. */
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f2efe9, #171615);
        --ink: light-dark(#2a2622, #efebe5);
        --body: light-dark(#4d4741, #cfc8bf);
        --muted: light-dark(#6b645c, #b0a89f);
        --line: light-dark(#e6e0d6, #35312d);
        --blue: light-dark(oklch(0.5 0.15 265), oklch(0.74 0.12 265));
        --blue-hover: light-dark(oklch(0.44 0.15 265), oklch(0.8 0.1 265));
        --on-blue: light-dark(#ffffff, #11131c);
        --serif: Georgia, 'Times New Roman', serif;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 20px;
        background: var(--bg);
        color: var(--body);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(22px, 2.4vw, 31px);
        max-width: 680px;
        text-align: center;
      }

      .wordmark {
        font-family: var(--serif);
        font-size: 22px;
        color: var(--ink);
      }

      .dot {
        color: var(--blue);
      }

      .code {
        display: flex;
        align-items: center;
        gap: clamp(8px, 1vw, 13px);
        font-family: var(--serif);
        font-size: clamp(110px, 16vw, 210px);
        line-height: 0.9;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      .ring {
        display: grid;
        place-items: center;
        width: 0.72em;
        height: 0.72em;
        border: 0.14em solid var(--blue);
        border-radius: 50%;
      }

      .ring-dot {
        width: 0.16em;
        height: 0.16em;
        border-radius: 50%;
        background: var(--blue);
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 400;
        font-size: clamp(28px, 3.4vw, 44px);
        line-height: 1.15;
        color: var(--ink);
      }

      .sub {
        margin: 10px 0 0;
        font-size: clamp(16px, 1.45vw, 19px);
        line-height: 1.6;
        color: var(--muted);
      }

      .es {
        width: 100%;
        max-width: 420px;
        padding-top: clamp(16px, 1.8vw, 23px);
        border-top: 1px solid var(--line);
      }

      .es p {
        margin: 0;
      }

      .es-title {
        font-family: var(--serif);
        font-size: 19px;
        color: var(--body);
      }

      .es-sub {
        margin-top: 4px !important;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }

      .reload {
        display: inline-flex;
        padding: 15px 26px;
        border: 0;
        border-radius: 999px;
        background: var(--blue);
        color: var(--on-blue);
        font: 500 15px var(--sans);
        text-decoration: none;
        cursor: pointer;
      }

      .reload:hover {
        background: var(--blue-hover);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: no-preference) {
        @keyframes pulse {
          0%,
          100% {
            transform: scale(1);
          }
          50% {
            transform: scale(0.9);
          }
        }

        .ring {
          animation: pulse 2.6s ease-in-out infinite;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="wordmark">David Cadavid<span class="dot">.</span></span>
      <div class="code" aria-hidden="true">
        <span>5</span>
        <span class="ring"><span class="ring-dot"></span></span>
        <span>3</span>
      </div>
      <p class="visually-hidden">503</p>
      <div>
        <h1>Back in a moment.</h1>
        <p class="sub">The site is getting some maintenance.</p>
      </div>
      <div class="es" lang="es">
        <p class="es-title">Volvemos en un momento.</p>
        <p class="es-sub">El sitio está en mantenimiento.</p>
      </div>
      <a class="reload" href="/" onclick="location.reload(); return false;">Reload · <span lang="es">Recargar</span></a>
    </main>
  </body>
</html>
